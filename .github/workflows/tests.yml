name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest tests/ -v

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Node 22 strips TypeScript natively, so the pure helpers are tested
      # from source with no build step.
      - name: Run card tests
        run: npm run test:js
      - name: Verify the committed bundle matches the sources
        run: |
          cp custom_components/teslamate_cards/frontend/teslamate-cards.js /tmp/committed.js
          npm run build
          diff -q /tmp/committed.js custom_components/teslamate_cards/frontend/teslamate-cards.js \
            || { echo "::error::Committed bundle is stale -- run 'npm run build' and commit the result"; exit 1; }
